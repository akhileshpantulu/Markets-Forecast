# Weakly informative priors for the baseline engine. ALL VALUES ARE ASSUMPTIONS,
# written before fitting any real data, and used only for shrinkage when the
# history is short or a parameter is poorly identified. The fitted value, the
# prior, and the shrinkage weight are reported in every run.
status: assumption

demand:
  mu_log_growth: {mean: 0.010, sd: 0.020}        # long-run annual log demand growth in normal years
  phi: {mean: 0.20, sd: 0.30, lower: -0.5, upper: 0.9}
  residual_sd: {mean: 0.040, pseudo_obs: 2}      # sd shrinks toward this with the weight of 2 observations

shock:
  # A year is a shock year when its log demand growth falls more than
  # threshold_robust_sd robust standard deviations below the median.
  threshold_robust_sd: 2.0
  # Shock years falling further than this (log) are "severe" (COVID-scale).
  severe_log_deviation: -0.5
  # Years after a shock whose growth forms its recovery profile.
  max_recovery_years: 2
  # Annual probability of each class: Beta prior, updated with the count of
  # shock years in the market's history.
  moderate: {a: 1.5, b: 13.5}                    # prior mean 10% a year
  severe: {a: 0.5, b: 49.5}                      # prior mean 1% a year

adr:
  # Downturn pass-through: ADR % per 1% occupancy change in shock and recovery years.
  beta_pricing_power: {mean: 0.50, sd: 0.50, lower: 0.0}
  # User decision (2026-11-06): occupancy and rate move inversely outside downturns.
  # ADR % per 1% occupancy change beyond its trend in normal years. ASSUMPTION: history
  # shows a positive slope in both pilot markets, so this is a judgement, adjustable on the page.
  occ_change_response: {value: -0.25}
  # Rate dampening per unit of last year's occupancy above the market's normal level
  # (-0.20: 5 points above normal takes 1.0 point off real ADR growth). Fitted on normal
  # years and shrunk toward this prior; never positive.
  occ_level_dampening: {mean: -0.20, sd: 0.20, upper: 0.0}
  # Extra dampening per unit of occupancy above the threshold (ASSUMPTION; history has
  # almost no years at 90%+). -0.50: at 93%, a further 1.5 points off real ADR growth.
  high_occupancy: {threshold: 0.90, dampening: -0.50}
  residual_phi: {mean: 0.30, sd: 0.30, lower: -0.5, upper: 0.9}
  residual_sd: {mean: 0.040, pseudo_obs: 2}

correlation:
  demand_adr_residual: {mean: 0.30, sd: 0.30}

backtest:
  first_origin_min_years: 8                      # usable growth observations needed before the first origin
  paths: 2000
  target_coverage: 0.80
  calibrate_if_outside: [0.70, 0.90]
  # Approved by the user on 2026-11-06: widen bands per forecast horizon so each
  # horizon's P10 to P90 coverage (ex-COVID outcomes) gets as close to 80% as the
  # grid allows. Bands are only ever widened, and never narrower than the year before.
  horizon_calibration: true
