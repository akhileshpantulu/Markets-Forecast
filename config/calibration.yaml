version: 1
calibrated_on: '2026-11-09'
panel_snapshot: 2026-09
groups:
- id: baseline
  title: Baseline
  help: The long-run RevPAR CAGR of the market's own history. By default occupancy is held flat and rate carries the growth.
- id: supply
  title: Supply above trend
  help: Effect of supply growth above the market's long-run supply trend, measured across European submarkets.
- id: quality
  title: Supply quality
  help: How the tier and product type of new and closing hotels move market rate and occupancy. Tier indices are relative
    to Upscale = 1.0.
- id: events
  title: Events (analog defaults)
  help: Effects measured in past events' host submarkets, used when an event card gives no attendance figures. Log points
    in the event months.
- id: calculators
  title: Driver calculators
  help: Defaults used by the driver calculators when a card does not state them.
- id: shocks
  title: Downturn risk
  help: Base rate and depth of downturns, used to size drivers that raise the chance of a downturn. The baseline already contains
    the historical rate.
- id: ranges
  title: Ranges
  help: The P10 to P90 range comes from how far the long-run CAGR rule has missed across European submarkets, scaled to this
    market's own volatility.
params:
  baseline.occupancy_split:
    group: baseline
    label: How the baseline splits RevPAR growth
    kind: select
    options:
    - - flat
      - Occupancy flat; rate carries the RevPAR CAGR
    - - historical
      - Occupancy and ADR at their own long-run CAGRs
    value: flat
    status: user_decision
    evidence: The user's practice (2026-11-09) holds occupancy flat unless a demand driver moves it.
  baseline.start_year:
    group: baseline
    label: Long-run CAGR from year (blank for the earliest year of data)
    kind: year
    min: 1990
    max: 2030
    step: 1
    value: null
    status: default
    evidence: 'User rule (2026-11-10): the window starts at the earliest complete year of data and ends at the last complete non-COVID year. Confirmed data breaks are adjusted so they do not count as growth.'
  baseline.inflation_pass_through:
    group: baseline
    label: ADR points per point of inflation above its historical average
    kind: number
    min: 0
    max: 3
    step: 0.1
    value: 1.0
    status: assumption
    evidence: 'Same-year fit 2026-11-09: London 1.21 (se 0.96), Paris 4.55 (se 1.32, reflects the economic cycle). Too noisy
      to fit; 1:1 kept.'
  supply.occ_response:
    group: supply
    label: Occupancy % per 1% of supply growth above trend, same year
    kind: number
    min: -1.5
    max: 0.5
    step: 0.01
    value: -0.5067
    status: fitted
    evidence: 'European panel, CoStar snapshot 2026-09: 295 submarkets, 4672 submarket-years (1998 to 2025, COVID years excluded);
      two-way fixed effects, standard errors clustered by submarket. Estimate -0.507 (se 0.044).'
    fitted_on: '2026-11-09'
  supply.occ_response_next_year:
