    format: ine_json
    use: [reference_demand_es]
    url: https://servicios.ine.es/wstempus/js/es/DATOS_TABLA/2059?tip=AM
  - id: ine_46298
    publisher: Instituto Nacional de Estadistica (Spain)
    title: INE Tempus table 46298
    format: ine_json
    use: [reference_demand_es]
    url: https://servicios.ine.es/wstempus/js/es/DATOS_TABLA/46298?tip=AM
