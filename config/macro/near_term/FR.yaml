# Near-term inflation for France (user decision 2026-11-06: take the current and next years
# from central bank forecasts, searched and dated at run time; IMF fills the later years).
# These override config/macro/generated/FR.yaml for the years listed.
#
# Source: Banque de France interim macroeconomic projections, September 2026 (annual average
# HICP). Two caveats, both reported on the page:
#  1. Measure: Banque de France projects HICP; the CPI history used for real ADR is the national
#     CPI (IMF). HICP has run above CPI recently (October 2026: HICP 3.8%, CPI 3.4%).
#  2. Timing: the projections predate the September and October 2026 prints (HICP 3.4% and 3.8%,
#     energy +24%) and the IMF October 2026 forecast. The December 2026 edition will replace them.
#
# Verification: the session network blocks banque-france.fr and insee.fr, so every figure is
# from search results. 2026 appears in several snippets; 2027 and 2028 in search summaries only.
