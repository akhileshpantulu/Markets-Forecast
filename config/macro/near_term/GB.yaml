# Near-term inflation for the United Kingdom (user decision 2026-11-06: take the current and
# next years from official near-term forecasts, searched and dated at run time; IMF fills the
# later years). These override config/macro/generated/GB.yaml for the years listed.
#
# The Bank of England publishes CPI projections as Q4 four-quarter rates, not calendar-year
# averages, and its November 2026 table could not be retrieved. The calendar-year averages
# below come from the OBR, the UK's official fiscal forecaster, published 28 Oct 2026.
# The Bank's November 2026 report (5 Nov 2026) is higher in the near term: CPI around 4.5% in
# 2027 Q1 and around 5% (4.9%) in 2027 Q2. Treat 2027 as an upside risk.
#
# Verification: the session network blocks obr.uk, gov.uk and bankofengland.co.uk, so every
# figure is from search results, not the document itself. Re-check against the PDF when the
# hosts are allowed. Run-time refresh: /forecast step 0 (see .claude/commands/forecast.md).
